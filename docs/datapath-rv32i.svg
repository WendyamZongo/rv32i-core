<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="940" viewBox="0 0 1360 940" font-family="Segoe UI, Helvetica, Arial, sans-serif">

  <defs>
    <marker id="a" markerWidth="9" markerHeight="7" refX="8.5" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#2b2b2b"/>
    </marker>
    <marker id="ac" markerWidth="9" markerHeight="7" refX="8.5" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#B33A3A"/>
    </marker>
  </defs>

  <rect width="1360" height="940" fill="#ffffff"/>

  <!-- ===== TITLE ===== -->
  <text x="40" y="30" font-size="21" font-weight="600" fill="#1F3864">RV32I single-cycle datapath</text>
  <text x="40" y="51" font-size="13" fill="#666">One instruction per clock cycle — the whole instruction traverses the path in a single cycle</text>

  <!-- ===== ADDERS ===== -->
  <rect x="285" y="100" width="100" height="52" rx="4" fill="#EEF2F8" stroke="#1F3864" stroke-width="1.6"/>
  <text x="335" y="124" font-size="13" font-weight="600" fill="#1F3864" text-anchor="middle">PC + 4</text>
  <text x="335" y="142" font-size="11" fill="#666" text-anchor="middle">next instruction</text>

  <rect x="980" y="100" width="130" height="52" rx="4" fill="#EEF2F8" stroke="#1F3864" stroke-width="1.6"/>
  <text x="1045" y="124" font-size="13" font-weight="600" fill="#1F3864" text-anchor="middle">PC + imm</text>
  <text x="1045" y="142" font-size="11" fill="#666" text-anchor="middle">branch target</text>

  <!-- ===== PC MUX ===== -->
  <polygon points="88,238 120,254 120,382 88,398" fill="#DCE6F2" stroke="#1F3864" stroke-width="1.6"/>
  <text x="104" y="230" font-size="10.5" font-weight="600" fill="#1F3864" text-anchor="middle">PC</text>
  <text x="104" y="306" font-size="11" font-weight="600" fill="#1F3864" text-anchor="middle">M</text>
  <text x="104" y="318" font-size="11" font-weight="600" fill="#1F3864" text-anchor="middle">U</text>
  <text x="104" y="330" font-size="11" font-weight="600" fill="#1F3864" text-anchor="middle">X</text>

  <!-- ===== PC ===== -->
  <rect x="158" y="290" width="70" height="58" rx="4" fill="#1F3864"/>
  <text x="193" y="318" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">PC</text>
  <text x="193" y="336" font-size="10" fill="#C8D4E8" text-anchor="middle">32 bits</text>

  <!-- ===== INSTRUCTION MEMORY ===== -->
  <rect x="285" y="260" width="138" height="116" rx="4" fill="#EEF2F8" stroke="#1F3864" stroke-width="1.6"/>
  <text x="354" y="306" font-size="13" font-weight="600" fill="#1F3864" text-anchor="middle">Instruction</text>
  <text x="354" y="324" font-size="13" font-weight="600" fill="#1F3864" text-anchor="middle">memory</text>
  <text x="354" y="346" font-size="11" fill="#666" text-anchor="middle">address → instruction</text>

  <!-- ===== INSTRUCTION FIELDS ===== -->
  <text x="440" y="240" font-size="11" font-weight="600" fill="#1F3864">fields</text>
  <text x="440" y="262" font-size="11.5" fill="#333">funct7 [31:25]</text>
  <text x="440" y="280" font-size="11.5" fill="#333">rs2 [24:20]</text>
  <text x="440" y="298" font-size="11.5" fill="#333">rs1 [19:15]</text>
  <text x="440" y="316" font-size="11.5" fill="#333">funct3 [14:12]</text>
  <text x="440" y="334" font-size="11.5" fill="#333">rd [11:7]</text>
  <text x="440" y="352" font-size="11.5" fill="#333">opcode [6:0]</text>

  <!-- ===== REGISTER FILE ===== -->
  <rect x="540" y="246" width="162" height="168" rx="4" fill="#EEF2F8" stroke="#1F3864" stroke-width="1.6"/>
  <text x="621" y="308" font-size="13" font-weight="600" fill="#1F3864" text-anchor="middle">Register file</text>
  <text x="621" y="328" font-size="12" fill="#444" text-anchor="middle">32 × 32 bits</text>
  <text x="621" y="350" font-size="11" fill="#666" text-anchor="middle">2 reads, 1 write</text>
  <text x="621" y="370" font-size="11" fill="#B33A3A" text-anchor="middle">x0 hardwired to zero</text>
  <text x="548" y="268" font-size="10" fill="#666">rs1</text>
  <text x="548" y="292" font-size="10" fill="#666">rs2</text>
  <text x="548" y="384" font-size="10" fill="#666">rd</text>
  <text x="548" y="402" font-size="10" fill="#666">write data</text>

  <!-- ===== IMMEDIATE GENERATOR ===== -->
  <rect x="540" y="460" width="162" height="62" rx="4" fill="#EEF2F8" stroke="#1F3864" stroke-width="1.6"/>
  <text x="621" y="486" font-size="13" font-weight="600" fill="#1F3864" text-anchor="middle">Immediate</text>
  <text x="621" y="504" font-size="13" font-weight="600" fill="#1F3864" text-anchor="middle">generator</text>
  <text x="621" y="542" font-size="11" fill="#B33A3A" text-anchor="middle">I · S · B · U · J formats</text>
  <text x="621" y="558" font-size="11" fill="#666" text-anchor="middle">sign-extended to 32 bits</text>

  <!-- ===== ALU MUX A ===== -->
  <polygon points="742,228 774,244 774,316 742,332" fill="#DCE6F2" stroke="#1F3864" stroke-width="1.6"/>
  <text x="758" y="220" font-size="10.5" font-weight="600" fill="#1F3864" text-anchor="middle">A</text>
  <text x="758" y="268" font-size="11" font-weight="600" fill="#1F3864" text-anchor="middle">M</text>
  <text x="758" y="280" font-size="11" font-weight="600" fill="#1F3864" text-anchor="middle">U</text>
  <text x="758" y="292" font-size="11" font-weight="600" fill="#1F3864" text-anchor="middle">X</text>

  <!-- ===== ALU MUX B ===== -->
  <polygon points="742,348 774,364 774,440 742,456" fill="#DCE6F2" stroke="#1F3864" stroke-width="1.6"/>
  <text x="758" y="340" font-size="10.5" font-weight="600" fill="#1F3864" text-anchor="middle">B</text>
  <text x="758" y="390" font-size="11" font-weight="600" fill="#1F3864" text-anchor="middle">M</text>
  <text x="758" y="402" font-size="11" font-weight="600" fill="#1F3864" text-anchor="middle">U</text>
  <text x="758" y="414" font-size="11" font-weight="600" fill="#1F3864" text-anchor="middle">X</text>

  <!-- ===== ALU ===== -->
  <rect x="818" y="256" width="108" height="156" rx="4" fill="#1F3864"/>
  <text x="872" y="320" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">ALU</text>
  <text x="872" y="342" font-size="10.5" fill="#C8D4E8" text-anchor="middle">add sub and or</text>
  <text x="872" y="356" font-size="10.5" fill="#C8D4E8" text-anchor="middle">xor sll srl sra</text>
  <text x="872" y="370" font-size="10.5" fill="#C8D4E8" text-anchor="middle">slt sltu</text>

  <!-- ===== DATA MEMORY ===== -->
  <rect x="1000" y="292" width="138" height="124" rx="4" fill="#EEF2F8" stroke="#1F3864" stroke-width="1.6"/>
  <text x="1069" y="336" font-size="13" font-weight="600" fill="#1F3864" text-anchor="middle">Data</text>
  <text x="1069" y="354" font-size="13" font-weight="600" fill="#1F3864" text-anchor="middle">memory</text>
  <text x="1069" y="378" font-size="11" fill="#666" text-anchor="middle">word accesses: lw · sw</text>
  <text x="1069" y="394" font-size="10" fill="#999" text-anchor="middle">byte lanes not implemented</text>
  <text x="1008" y="312" font-size="10" fill="#666">address</text>
  <text x="1008" y="412" font-size="10" fill="#666">write data</text>

  <!-- ===== WRITE-BACK MUX ===== -->
  <polygon points="1196,272 1228,288 1228,408 1196,424" fill="#DCE6F2" stroke="#1F3864" stroke-width="1.6"/>
  <text x="1212" y="264" font-size="10.5" font-weight="600" fill="#1F3864" text-anchor="middle">WB</text>
  <text x="1212" y="336" font-size="11" font-weight="600" fill="#1F3864" text-anchor="middle">M</text>
  <text x="1212" y="348" font-size="11" font-weight="600" fill="#1F3864" text-anchor="middle">U</text>
  <text x="1212" y="360" font-size="11" font-weight="600" fill="#1F3864" text-anchor="middle">X</text>

  <!-- ===== BRANCH UNIT ===== -->
  <rect x="790" y="576" width="150" height="76" rx="4" fill="#EEF2F8" stroke="#1F3864" stroke-width="1.6"/>
  <text x="865" y="604" font-size="13" font-weight="600" fill="#1F3864" text-anchor="middle">Branch unit</text>
  <text x="865" y="622" font-size="10.5" fill="#666" text-anchor="middle">beq bne blt bge bltu bgeu</text>
  <text x="865" y="638" font-size="10" fill="#B33A3A" text-anchor="middle">condition selected by funct3</text>

  <!-- ================= DATA WIRES ================= -->

  <!-- PC mux -> PC -->
  <line x1="120" y1="318" x2="158" y2="318" stroke="#2b2b2b" stroke-width="1.8" marker-end="url(#a)"/>
  <!-- PC -> instruction memory -->
  <line x1="228" y1="319" x2="285" y2="319" stroke="#2b2b2b" stroke-width="1.8" marker-end="url(#a)"/>
  <circle cx="256" cy="319" r="3.5" fill="#2b2b2b"/>

  <!-- PC -> +4 adder -->
  <polyline points="256,319 256,126 285,126" fill="none" stroke="#2b2b2b" stroke-width="1.8" marker-end="url(#a)"/>
  <circle cx="256" cy="126" r="3.5" fill="#2b2b2b"/>
  <!-- PC -> top bus -> branch adder -->
  <polyline points="256,126 256,70 1045,70 1045,100" fill="none" stroke="#2b2b2b" stroke-width="1.8" marker-end="url(#a)"/>
  <!-- PC -> ALU mux A (for auipc / jal) -->
  <circle cx="736" cy="70" r="3.5" fill="#2b2b2b"/>
  <polyline points="736,70 736,280 742,280" fill="none" stroke="#2b2b2b" stroke-width="1.8" marker-end="url(#a)"/>

  <!-- PC+4 -> PC mux (top input) -->
  <polyline points="385,126 404,126 404,88 30,88 30,262 88,262" fill="none" stroke="#2b2b2b" stroke-width="1.8" marker-end="url(#a)"/>
  <circle cx="404" cy="88" r="3.5" fill="#2b2b2b"/>
  <!-- PC+4 -> write-back mux (for jal / jalr) -->
  <polyline points="404,88 1266,88 1266,470 1180,470 1180,404 1196,404" fill="none" stroke="#2b2b2b" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- branch target -> PC mux (middle input) -->
  <polyline points="980,126 846,126 846,206 52,206 52,310 88,310" fill="none" stroke="#2b2b2b" stroke-width="1.8" marker-end="url(#a)"/>

  <!-- instruction memory -> fields -->
  <line x1="423" y1="319" x2="434" y2="319" stroke="#2b2b2b" stroke-width="1.8"/>

  <!-- fields -> register file -->
  <polyline points="510,298 526,298 526,270 540,270" fill="none" stroke="#2b2b2b" stroke-width="1.6" marker-end="url(#a)"/>
  <polyline points="510,280 532,280 532,294 540,294" fill="none" stroke="#2b2b2b" stroke-width="1.6" marker-end="url(#a)"/>
  <polyline points="510,334 520,334 520,386 540,386" fill="none" stroke="#2b2b2b" stroke-width="1.6" marker-end="url(#a)"/>
  <!-- fields -> immediate generator -->
  <polyline points="510,352 514,352 514,492 540,492" fill="none" stroke="#2b2b2b" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- rs1_data -> ALU mux A, and -> branch unit -->
  <polyline points="702,290 712,290" fill="none" stroke="#2b2b2b" stroke-width="1.8"/>
  <circle cx="712" cy="290" r="3.5" fill="#2b2b2b"/>
  <polyline points="712,290 712,246 742,246" fill="none" stroke="#2b2b2b" stroke-width="1.8" marker-end="url(#a)"/>
  <polyline points="712,290 712,598 790,598" fill="none" stroke="#2b2b2b" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- rs2_data -> ALU mux B, data memory, branch unit -->
  <polyline points="702,340 726,340" fill="none" stroke="#2b2b2b" stroke-width="1.8"/>
  <polyline points="726,340 726,630 790,630" fill="none" stroke="#2b2b2b" stroke-width="1.6" marker-end="url(#a)"/>
  <circle cx="726" cy="366" r="3.5" fill="#2b2b2b"/>
  <polyline points="726,366 742,366" fill="none" stroke="#2b2b2b" stroke-width="1.8" marker-end="url(#a)"/>
  <circle cx="726" cy="468" r="3.5" fill="#2b2b2b"/>
  <polyline points="726,468 982,468 982,396 1000,396" fill="none" stroke="#2b2b2b" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- constant zero -> ALU mux A (for lui) -->
  <text x="726" y="318" font-size="11" font-weight="600" fill="#666" text-anchor="end">0</text>
  <line x1="732" y1="314" x2="742" y2="314" stroke="#2b2b2b" stroke-width="1.8" marker-end="url(#a)"/>

  <!-- immediate -> ALU mux B, and -> branch adder -->
  <polyline points="702,492 734,492" fill="none" stroke="#2b2b2b" stroke-width="1.8"/>
  <circle cx="734" cy="492" r="3.5" fill="#2b2b2b"/>
  <polyline points="734,492 734,438 742,438" fill="none" stroke="#2b2b2b" stroke-width="1.8" marker-end="url(#a)"/>
  <polyline points="734,492 734,540 1150,540 1150,126 1110,126" fill="none" stroke="#2b2b2b" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- ALU mux A -> ALU input A -->
  <polyline points="774,280 796,280 796,288 818,288" fill="none" stroke="#2b2b2b" stroke-width="1.8" marker-end="url(#a)"/>
  <!-- ALU mux B -> ALU input B -->
  <polyline points="774,402 796,402 796,380 818,380" fill="none" stroke="#2b2b2b" stroke-width="1.8" marker-end="url(#a)"/>

  <!-- ALU -> data memory address -->
  <polyline points="926,330 1000,330" fill="none" stroke="#2b2b2b" stroke-width="1.8" marker-end="url(#a)"/>
  <circle cx="958" cy="330" r="3.5" fill="#2b2b2b"/>
  <!-- ALU -> write-back mux -->
  <polyline points="958,330 958,254 1172,254 1172,292 1196,292" fill="none" stroke="#2b2b2b" stroke-width="1.8" marker-end="url(#a)"/>
  <!-- ALU -> PC mux (jump target, jal and jalr) -->
  <polyline points="958,330 958,718 70,718 70,358 88,358" fill="none" stroke="#2b2b2b" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="520" y="712" font-size="10.5" fill="#666">jump target (jal / jalr)</text>

  <!-- data memory -> write-back mux -->
  <polyline points="1138,354 1196,354" fill="none" stroke="#2b2b2b" stroke-width="1.8" marker-end="url(#a)"/>

  <!-- write-back mux -> register file -->
  <polyline points="1228,348 1300,348 1300,690 508,690 508,404 540,404" fill="none" stroke="#2b2b2b" stroke-width="1.8" marker-end="url(#a)"/>
  <text x="1060" y="682" font-size="11" fill="#666" text-anchor="middle">write-back</text>

  <!-- ================= CONTROL UNIT ================= -->
  <rect x="130" y="740" width="690" height="172" rx="5" fill="#FBF0F0" stroke="#B33A3A" stroke-width="1.6"/>
  <text x="150" y="768" font-size="14" font-weight="700" fill="#B33A3A">Control</text>
  <text x="150" y="788" font-size="11" fill="#8a4040">main decoder: opcode [6:0]   ·   ALU decoder: alu_op, funct3 [14:12], inst[30], opcode[5]</text>

  <text x="150" y="816" font-size="11.5" fill="#333"><tspan font-weight="600">reg_write</tspan>  → register file</text>
  <text x="150" y="836" font-size="11.5" fill="#333"><tspan font-weight="600">im_src [2:0]</tspan>  → immediate generator</text>
  <text x="150" y="856" font-size="11.5" fill="#333"><tspan font-weight="600">alu_src_a [1:0]</tspan>  → mux A  (rs1 / PC / 0)</text>
  <text x="150" y="876" font-size="11.5" fill="#333"><tspan font-weight="600">alu_src_b</tspan>  → mux B  (0 = rs2, 1 = imm)</text>
  <text x="150" y="896" font-size="11.5" fill="#333"><tspan font-weight="600">alu_op [1:0]</tspan>  → ALU decoder</text>

  <text x="500" y="816" font-size="11.5" fill="#333"><tspan font-weight="600">alu_ctl [3:0]</tspan>  → ALU</text>
  <text x="500" y="836" font-size="11.5" fill="#333"><tspan font-weight="600">read_mem</tspan>, <tspan font-weight="600">write_mem</tspan>  → data memory</text>
  <text x="500" y="856" font-size="11.5" fill="#333"><tspan font-weight="600">wb_sel [1:0]</tspan>  → write-back mux</text>
  <text x="500" y="876" font-size="11.5" fill="#333"><tspan font-weight="600">branch</tspan>, <tspan font-weight="600">jump</tspan>  → PC mux</text>
  <text x="500" y="896" font-size="11" fill="#8a4040">branch taken  =  branch &amp; taken</text>

  <!-- instruction -> control -->
  <polyline points="470,366 470,740" fill="none" stroke="#B33A3A" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#ac)"/>
  <!-- control -> PC mux -->
  <polyline points="130,862 44,862 44,410 104,410 104,398" fill="none" stroke="#B33A3A" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#ac)"/>
  <!-- branch unit -> control -->
  <polyline points="865,652 865,768 820,768" fill="none" stroke="#B33A3A" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#ac)"/>
  <text x="876" y="672" font-size="11" fill="#B33A3A">taken</text>

  <!-- ===== LEGEND ===== -->
  <line x1="900" y1="770" x2="940" y2="770" stroke="#2b2b2b" stroke-width="1.8"/>
  <text x="950" y="774" font-size="11.5" fill="#444">datapath</text>
  <line x1="900" y1="796" x2="940" y2="796" stroke="#B33A3A" stroke-width="1.6" stroke-dasharray="5 3"/>
  <text x="950" y="800" font-size="11.5" fill="#444">control signal</text>
  <circle cx="920" cy="822" r="3.5" fill="#2b2b2b"/>
  <text x="950" y="826" font-size="11.5" fill="#444">junction</text>
  <text x="900" y="856" font-size="11.5" fill="#888">Wires that cross without a dot are</text>
  <text x="900" y="872" font-size="11.5" fill="#888">not connected.</text>

</svg>
